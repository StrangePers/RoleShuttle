name: Check public preview

on: [push, pull_request]

permissions:
  contents: read

jobs:
  preview:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: roleshuttle demo
      - name: Scan Git history for credentials
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'roleshuttle-scan'
          New-Item -ItemType Directory -Path $dir | Out-Null
          $archive = Join-Path $dir 'scanner.zip'
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $archive
          if ((Get-FileHash $archive).Hash -ne 'D29144DEFF3A68AA93CED33DDDF84B7FDC26070ADD4AA0F4513094C8332AFC4E') { throw 'Scanner checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $dir
          & "$dir/gitleaks.exe" git --redact=100 --no-banner --log-opts="--all" .
